<html>
<head>
	<title>Hypotrochoid</title>
	<link rel="icon" href="img/favicon.png">
	<link rel="stylesheet" type="text/css" href="stylesheets/materialize.css">
	<link rel="stylesheet" type="text/css" href="stylesheets/style.css">
	<link rel="stylesheet" type="text/css" href="stylesheets/jquery-ui.theme.css">
	<link rel="stylesheet" type="text/css" href="stylesheets/jquery-ui.structure.css">
	<link rel="stylesheet" type="text/css" href="stylesheets/jquery-ui.css">

  <script type="application/javascript" src="vendor/jquery-2.1.3.js"></script>
  <script type="application/javascript" src="vendor/jquery-ui.js"></script>
  <script type="application/javascript" src="vendor/underscore.js"></script>

	<script type="application/javascript" src="lib/util.js"></script>
	<script type="application/javascript" src="lib/menu.js"></script>
  <script type="application/javascript" src="lib/sketchObject.js"></script>
  <script type="application/javascript" src="lib/gradient.js"></script>
  <script type="application/javascript" src="lib/rollingTracer.js"></script>
  <script type="application/javascript" src="lib/sketch.js"></script>
  <script type="application/javascript" src="lib/animator.js"></script>
</head>

<body>
	<canvas id="overlay-canvas"></canvas>
	<canvas id="trace-canvas"></canvas>
	<div id="controls" class="blue-grey darken-4">
		<!-- general -->
		<fieldset class="general group">
			<legend>General</legend><hr>
			<div class="control-inputs">
				<label for="steps">Steps</label>
				<input type="number" min="1" id="steps" class="spinner">
			</div><br>
			<button type="button" class="start-stop-btn waves-effect waves-light btn">Stop</button>
			<button type="button" class="clear-btn waves-effect waves-light btn">Clear</button>
		</fieldset>
		<!-- controls for hypotrochoid -->
		<fieldset class="hypotrochoid-set">
			<legend>Hypotrochoid</legend>
			<hr>

		</fieldset>
		<!-- controls for rolling tracer -->
		<fieldset class="tracer-set">
			<legend>Rolling Tracer</legend>
			<hr>
			<div class="control-inputs">
				<label for="center-period-mult">Center Period Mult</label>
				<input type="number" step="any" min="0" id="center-period-mult" class="spinner">
			</div><br>
			<button id="tracer-toggle" class="waves-effect waves-light btn"></button>
		</fieldset>
		<!-- controls for spin -->
		<fieldset class="spin-set">
			<legend>Spin</legend>
			<hr>
			<div class="control-inputs">
				<label for="spin-period-mult">Spin Period Mult</label>
				<input type="number" step="any" min="0" id="spin-period-mult" class="spinner">
			</div><br>
		</fieldset>
		<!-- controls for tracing arm -->
		<fieldset>
			<legend>Tracing Arm</legend>
			<hr>
		</fieldset>
		<!-- controls for color -->
		<fieldset>
			<legend>Color</legend>
			<hr>
		</fieldset>
	</div>
<script>
(function () {

	var overlayCanvas = document.getElementById("overlay-canvas");
	var traceCanvas = document.getElementById("trace-canvas");
	var canvasEls = [overlayCanvas, traceCanvas];
	canvasEls.forEach(function(canvas){
		canvas.width = Ace.Sketch.DIM_X
		canvas.height = Ace.Sketch.DIM_Y
	})
	var overlayCtx = overlayCanvas.getContext("2d");
	var traceCtx = traceCanvas.getContext("2d");
  var sketch = Ace.sketch = new Ace.Sketch();
	var animator = Ace.animator = new Ace.Animator(sketch, overlayCtx, traceCtx)
	animator.start();
	Ace.Menu.initialize(animator);
})();
</script>
</body>
</html>
